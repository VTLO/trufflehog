plugins {
    id 'com.android.application'
}

// ABIs to package. Each one needs app/src/main/jniLibs/<abi>/libtrufflehog.so
// (see ../build.sh). Override with -PtruffleAbis=arm64-v8a,x86_64
def abis = (project.findProperty('truffleAbis') ?: 'arm64-v8a,x86_64').split(',')

android {
    namespace 'com.vtlo.trufflehog'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vtlo.trufflehog'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName(project.findProperty('truffleVersion') ?: '3.0-android')
        ndk { abiFilters(*abis) }
    }

    signingConfigs {
        // Supply a real keystore with -PreleaseStoreFile=... -PreleaseStorePassword=...
        // -PreleaseKeyAlias=... -PreleaseKeyPassword=... ; otherwise the APK is
        // signed with the local debug key so it installs directly on a device.
        if (project.hasProperty('releaseStoreFile')) {
            release {
                storeFile file(project.property('releaseStoreFile'))
                storePassword project.property('releaseStorePassword')
                keyAlias project.property('releaseKeyAlias')
                keyPassword project.property('releaseKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig project.hasProperty('releaseStoreFile') ? signingConfigs.release : signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // Binaries must be extracted to nativeLibraryDir to be executable.
            useLegacyPackaging true
            keepDebugSymbols += ['**/libtrufflehog.so', '**/libgit.so', '**/libgit-remote-http.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Terminal emulator + PTY (Apache-2.0), used for trufflehog's interactive
    // TUI (`trufflehog` with no arguments and `trufflehog analyze`).
    implementation 'com.github.termux.termux-app:terminal-view:v0.118.1'
    implementation 'androidx.annotation:annotation:1.8.2'
}
